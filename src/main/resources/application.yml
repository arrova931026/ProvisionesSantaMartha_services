spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 35MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FunerariaHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: funeraria
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

mercadopago:
  access-token: ${MP_ACCESS_TOKEN}
  public-key: ${MP_PUBLIC_KEY}
  back-url-base: ${MP_BACK_URL_BASE}
  webhook-secret: ${MP_WEBHOOK_SECRET:}

server:
  port: ${PORT}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}                   # 24 h
    refresh-expiration-ms: ${JWT_REFRESH_MS}               # 7 d
  cors:
    allowed-origins: ${CORS_ORIGINS}
  profile-pictures-dir: ${PROFILE_PICTURES_DIR:profile_pictures}   # solo lectura legacy
  docs-dir: ${DOCS_DIR:docs}                                        # solo lectura legacy
  frontend-url: ${FRONTEND_URL}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  mail:
    from: ${MAIL_FROM}

# ─── FTP Storage ──────────────────────────────────────────────────────────────
# Nota de seguridad: FTP (puerto 21) no cifra la conexión.
# Migrá a SFTP o FTPS cuando sea posible.
ftp:
  host: ${FTP_HOST:ftp.sociedadhumanistasantamartha.com}
  port: ${FTP_PORT:21}
  username: ${FTP_USERNAME:socied33}
  password: ${FTP_PASSWORD}
  remote-base-dir: ${FTP_BASE_DIR:mutualista}
  public-base-url: ${FTP_PUBLIC_URL:https://sociedadhumanistasantamartha.com/mutualista}

gemini:
  api-key: ${GEMINI_API_KEY}

# ─── Vosk Speech Recognition ─────────────────────────────────────────────────
# Descarga el modelo español pequeño (≈40 MB) de:
#   https://alphacephei.com/vosk/models  →  vosk-model-small-es-0.42.zip
# Descomprime y apunta la ruta aquí (o con la variable de entorno VOSK_MODEL_PATH).
# Si la ruta queda vacía la validación se omite y el video se acepta sin revisar.
vosk:
  model-path: ${VOSK_MODEL_PATH:}
  ffmpeg-path: ${VOSK_FFMPEG_PATH:ffmpeg}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.shsm: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN